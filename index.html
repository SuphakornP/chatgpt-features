<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050806">
  <meta name="color-scheme" content="dark">
  <title>ChatGPT + Codex Features — 22 Features ภาษาไทย</title>
  <meta name="description" content="Web Slide ภาษาไทยสำหรับเรียนรู้ 22 ChatGPT และ Codex Features จากเอกสารทางการ OpenAI พร้อม Feature Explorer และ official references">
  <meta property="og:title" content="ChatGPT + Codex Features">
  <meta property="og:description" content="22 Features. จากคำสั่งเดียว สู่ระบบงานที่เดินต่อได้">
  <meta property="og:type" content="website">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23050806'/%3E%3Ccircle cx='32' cy='32' r='22' fill='none' stroke='%23dafe68' stroke-width='3'/%3E%3Ccircle cx='32' cy='32' r='6' fill='%23dafe68'/%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body data-mode="deck">
  <a class="skip-link" href="#deck">ข้ามไปที่เนื้อหา</a>

  <div class="atmosphere" aria-hidden="true">
    <div class="atmosphere__image"></div>
    <div class="atmosphere__mesh"></div>
    <div class="atmosphere__scan"></div>
    <div class="atmosphere__noise"></div>
  </div>

  <header class="topbar">
    <a class="brand" href="#cover" aria-label="กลับไปหน้าแรก">
      <span class="brand__mark" aria-hidden="true">
        <svg viewBox="0 0 40 40" role="img">
          <circle cx="20" cy="20" r="15"></circle>
          <circle cx="20" cy="20" r="4"></circle>
          <path d="M20 1v8M20 31v8M1 20h8M31 20h8"></path>
        </svg>
      </span>
      <span class="brand__copy">
        <strong>FEATURE</strong>
        <small>ChatGPT + Codex · ภาษาไทย</small>
      </span>
    </a>

    <div class="topbar__status" aria-live="polite">
      <span id="chapterCode">00</span>
      <span class="topbar__line"></span>
      <span id="chapterName">INTRO</span>
    </div>

    <div class="topbar__actions">
      <button class="utility-button" id="modeToggle" type="button" aria-pressed="false" aria-label="สลับระหว่างโหมดสไลด์และอ่านต่อเนื่อง">
        <span aria-hidden="true">≋</span>
        <span class="utility-button__label">อ่านต่อเนื่อง</span>
      </button>
      <button class="utility-button utility-button--accent" id="exploreButton" type="button" aria-haspopup="dialog" aria-label="สำรวจ 22 Features">
        <span aria-hidden="true">⌘</span>
        <span class="utility-button__label">สำรวจ 22 Features</span>
      </button>
    </div>
  </header>

  <main class="deck" id="deck" tabindex="-1" aria-label="ChatGPT และ Codex Feature presentation"></main>

  <nav class="deck-controls" aria-label="ควบคุมสไลด์">
    <button class="deck-controls__button" id="prevSlide" type="button" aria-label="สไลด์ก่อนหน้า">
      <span aria-hidden="true">←</span>
    </button>
    <div class="deck-controls__meter">
      <div class="deck-controls__numbers" aria-live="polite">
        <span id="slideCurrent">01</span>
        <span class="deck-controls__slash">/</span>
        <span id="slideTotal">00</span>
      </div>
      <div class="progress-track" aria-hidden="true"><span id="progressFill"></span></div>
    </div>
    <button class="deck-controls__button deck-controls__button--next" id="nextSlide" type="button" aria-label="สไลด์ถัดไป">
      <span aria-hidden="true">→</span>
    </button>
  </nav>

  <dialog class="feature-dialog" id="featureDialog" aria-labelledby="explorerTitle">
    <div class="feature-dialog__shell">
      <header class="feature-dialog__header">
        <div>
          <p class="micro-label">EXPLORE INDEX / 22 FEATURES</p>
          <h2 id="explorerTitle">เลือก Feature จากงานที่ต้องทำ</h2>
        </div>
        <button class="dialog-close" id="dialogClose" type="button" aria-label="ปิด Feature Explorer">×</button>
      </header>

      <div class="feature-dialog__body">
        <aside class="feature-index" aria-label="Feature index">
          <label class="search-field">
            <span class="visually-hidden">ค้นหา Feature</span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"></circle><path d="m16 16 4 4"></path></svg>
            <input id="featureSearch" type="search" placeholder="ค้นหา เช่น web, files, งานซ้ำ…" autocomplete="off">
          </label>
          <div class="filter-tabs" id="filterTabs" role="group" aria-label="กรองตามหมวด">
            <button type="button" data-filter="all" aria-pressed="true">ทั้งหมด <span>22</span></button>
            <button type="button" data-filter="workflows" aria-pressed="false">Workflows <span>8</span></button>
            <button type="button" data-filter="capabilities" aria-pressed="false">Capabilities <span>10</span></button>
            <button type="button" data-filter="reference" aria-pressed="false">Reference <span>4</span></button>
          </div>
          <div class="feature-index__list" id="featureList"></div>
        </aside>

        <article class="feature-detail" id="featureDetail" tabindex="-1" aria-live="polite"></article>
      </div>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <noscript>
    <div class="noscript">เว็บไซต์นี้ต้องใช้ JavaScript เพื่อแสดง Web Slide และ Feature Explorer</div>
  </noscript>

  <script src="assets/js/content.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
